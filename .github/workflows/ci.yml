name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check the layering rule
        # The pure modules must never import audio, UI, or Win32 libraries.
        # Called out separately so a failure here is obvious in the log rather
        # than buried among 279 dots.
        run: python -m pytest tests/test_boundaries.py -v
